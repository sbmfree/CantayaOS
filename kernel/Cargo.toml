# CantayaOS Kernel
#
# The hybrid kernel, inspired by Windows NT architecture.
# This is a #![no_std] bare-metal kernel for x86_64.
#
# Architecture layers (bottom to top):
#   1. HAL (Hardware Abstraction Layer) — CPU, interrupts, timers, port I/O
#   2. Kernel Core — memory manager, scheduler, synchronization
#   3. Executive — process manager, I/O manager, object manager, security
#   4. (Future) Subsystems — Win32-like compatibility layer
#
# The kernel is loaded by our UEFI bootloader at 0xFFFFFFFF80000000 (higher half).

[package]
name = "cantaya_kernel"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
cantaya_shared = { path = "../shared" }
spin = { workspace = true }
bitflags = { workspace = true }
log = { workspace = true }
